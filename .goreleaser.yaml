version: 2

project_name: hledger-x

before:
  hooks:
    - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl arm-unknown-linux-gnueabihf x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu
    - cargo install --locked cargo-zigbuild

builds:
  - id: hledger-xfmt
    builder: rust
    binary: hledger-xfmt
    flags:
      - --release
      - --bin=hledger-xfmt
    targets: &targets
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - arm-unknown-linux-gnueabihf
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu
  - id: hledger-xadd
    builder: rust
    binary: hledger-xadd
    flags:
      - --release
      - --bin=hledger-xadd
    targets: *targets

archives:
  # One archive per binary per target: each build gets its own `ids` entry, so
  # a target yields a hledger-xfmt tarball and a hledger-xadd tarball.
  - id: hledger-xfmt
    ids:
      - hledger-xfmt
    formats: &formats
      - tar.gz
    name_template: "hledger-xfmt_{{ .Version }}_{{ .Target }}"
    format_overrides: &format_overrides
      - goos: windows
        formats:
          - zip
    files: &files
      - none*
  - id: hledger-xadd
    ids:
      - hledger-xadd
    formats: *formats
    name_template: "hledger-xadd_{{ .Version }}_{{ .Target }}"
    format_overrides: *format_overrides
    files: *files

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kfkonrad
    name: hledger-x
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
