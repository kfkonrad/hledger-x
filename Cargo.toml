[package]
name = "rledger"
version = "0.1.0"
edition = "2021"
description = "Plain text accounting tooling: a journal formatter and interactive data entry"
license = "MIT"
publish = false

[[bin]]
name = "rledger"
path = "src/main.rs"

[lib]
name = "rledger"
path = "src/lib.rs"

[dependencies]
# COMMAND LINE PARSING
clap = { version = "4.5.53", features = ["derive"] }
# SIMPLE PRETTY ERROR HANDLING
color-eyre = "0.6.5"
# SUPERPOWERED ITERATORS
itertools = "0.14.0"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
