[package]
name = "hledger-x"
version = "0.4.1"
edition = "2021"
description = "Plain text accounting tooling: a journal formatter and interactive data entry"
license = "MIT"

[[bin]]
name = "hledger-x"
path = "src/main.rs"

[lib]
name = "hledger_x"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
glob = "0.3.4"
regex = "1.13.1"
rust_decimal = "1.42.1"
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }
toml = "1.1.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimisation
codegen-units = 1 # Reduced to increase optimisations.
panic = 'abort'   # Abort on panic
strip = "symbols" # Strip symbols from binary
